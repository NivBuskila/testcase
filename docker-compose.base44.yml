services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    ports:
      - "3000:3000"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - DATABASE_URL=postgres://decisionforge:decisionforge_dev@db:5432/decisionforge
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "CI=true npm ci --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=decisionforge
      - POSTGRES_PASSWORD=decisionforge_dev
      - POSTGRES_DB=decisionforge
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionforge -d decisionforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

volumes:
  pgdata:
  node_modules:
  next_cache:
